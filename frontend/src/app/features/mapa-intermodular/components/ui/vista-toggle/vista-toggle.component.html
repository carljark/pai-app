<div
  class="vista-toggle"
  data-tour="mapa-vista"
  role="group"
  [attr.aria-label]="isCa() ? 'Forma de veure el mapa' : 'Forma de ver el mapa'"
>
  <button
    type="button"
    class="vista-toggle__option"
    [class.vista-toggle__option--active]="vista() === 'clasica'"
    [attr.aria-pressed]="vista() === 'clasica'"
    (click)="select('clasica')"
  >
    {{ isCa() ? 'Vista clàssica' : 'Vista clásica' }}
  </button>
  <button
    type="button"
    class="vista-toggle__option"
    [class.vista-toggle__option--active]="vista() === 'mental'"
    [attr.aria-pressed]="vista() === 'mental'"
    (click)="select('mental')"
  >
    Mapa mental
    <span class="vista-toggle__badge">beta</span>
  </button>
  @if (conPanoramica()) {
    <button
      type="button"
      class="vista-toggle__option"
      [class.vista-toggle__option--active]="vista() === 'panoramica'"
      [attr.aria-pressed]="vista() === 'panoramica'"
      (click)="select('panoramica')"
    >
      {{ isCa() ? 'Panoràmica' : 'Panorámica' }}
      <span class="vista-toggle__badge">beta</span>
    </button>
  }
</div>
