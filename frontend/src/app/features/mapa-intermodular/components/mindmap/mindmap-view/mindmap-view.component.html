<div class="mindmap-view" [class.mindmap-view--with-drawer]="!!selection()">
  <div class="mindmap-view__stage">
    <div class="mindmap-view__toolbar">
      <p class="mindmap-view__hint">{{ hint() }}</p>
      <app-mindmap-legend
        [items]="legend()"
        [isCa]="isCa()"
        (toggled)="state.toggleRelationFilter($event)"
      />
    </div>

    @if (facade.modules().length > 0) {
      <app-mindmap-canvas
        class="mindmap-view__canvas"
        [nodes]="nodes()"
        [links]="links()"
        [arcs]="arcs()"
        [radius]="radius()"
        [focusId]="focusId()"
        [isCa]="isCa()"
        (nodeActivate)="state.activate($event)"
      />
    } @else {
      <p class="mindmap-view__empty">
        {{ isCa() ? 'Aquest mapa encara no té mòduls.' : 'Este mapa todavía no tiene módulos.' }}
      </p>
    }
  </div>

  @if (selection(); as selection) {
    <app-connection-drawer
      class="mindmap-view__drawer"
      [sourceModule]="selection.module"
      [sourceRa]="selection.ra"
      [connection]="selection.connection"
      [activeTab]="facade.activeTab()"
      (closed)="state.closeConnection()"
      (createProject)="createProject.emit($event)"
    />
  }
</div>
