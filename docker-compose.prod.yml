services:
  mongodb:
    image: mongo:4.4
    container_name: pai_mongodb_prod
    restart: always
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27018:27017" # Ajusta si en tu EC2 el puerto de Mongo ya está ocupado
    volumes:
      - ./mongo_data:/data/db

  # Las imágenes se construyen en GitHub Actions y se publican en GHCR (deploy.yml): el EC2 solo
  # las descarga (PAI_TAG=sha-<commit>). `build:` se conserva para la vía de emergencia
  # (scripts/deploy-prod.sh), que construye en el EC2. Ver documentation/despliegue_produccion.md.
  backend:
    image: ghcr.io/carljark/pai-app-backend:${PAI_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pai_backend_prod
    restart: always
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/pai_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Gemini desactivado salvo GEMINI_ENABLED=true en .env (cuota gratuita de 20 peticiones/día)
      - GEMINI_ENABLED=${GEMINI_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Servidor MCP con OAuth: URL pública y URL de vuelta de otros clientes web, además de las de
      # claude.ai (separadas por comas). Ver documentation/servidor_mcp.md.
      - PUBLIC_URL=${PUBLIC_URL:-https://plappin.org}
      - MCP_OAUTH_REDIRECT_ALLOWLIST=${MCP_OAUTH_REDIRECT_ALLOWLIST:-}
    ports:
      - "3000:3000" # Este es el puerto que Nginx escuchará internamente
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb

  frontend:
    image: ghcr.io/carljark/pai-app-frontend:${PAI_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: pai_frontend_prod
    restart: always
    ports:
      - "8080:80" # Nginx HOST apuntará al 8080 de este contenedor
    depends_on:
      - backend
