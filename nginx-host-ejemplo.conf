server {
    server_name miproyeccion.duckdns.org; # <-- Cambia esto por tu dominio

    # Todo el tráfico de la API va al backend Node.js (puerto 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M; # Permitir subida de PDFs grandes
        
        # TIMEOUTS EXTENDIDOS PARA GEMINI AI Y SSE (1 hora)
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;

        # Configuración para Server-Sent Events (SSE)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    # El resto del tráfico va al frontend Angular (servido en el puerto 8080 del Docker)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Certbot añadirá aquí debajo la configuración SSL automáticamente
}
