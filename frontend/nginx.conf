server {
    listen 80;
    server_name localhost;

    # OAuth 2.1 del servidor MCP (conectores de claude.ai): el SDK publica los metadatos y los
    # endpoints en la raíz del dominio, así que se reenvían al backend (ver documentation/servidor_mcp.md).
    location ~ ^/(\.well-known/oauth-(authorization-server|protected-resource)(/.*)?|authorize|token|register|revoke)$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
