<div>
  <button
    (click)="openNotifications()"
    class="nav-item"
    [attr.data-tooltip]="trans.t().sidebarNotifications"
    [class.active]="activeCount() > 0 || unreadCount() > 0"
    style="width: 100%"
  >
    <div
      style="
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
      "
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      @if (unreadCount() > 0 || activeCount() > 0) {
        <span
          style="
            position: absolute;
            top: -2px;
            right: -2px;
            background: #e74c3c;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            border: 2px solid white;
          "
        ></span>
      }
    </div>

    <span class="nav-text">{{ trans.t().sidebarNotifications }}</span>

    @if (unreadCount() > 0 || activeCount() > 0) {
      <span
        class="nav-text"
        style="
          background: #e74c3c;
          color: white;
          border-radius: 20px;
          padding: 2px 8px;
          font-size: 0.75rem;
          margin-left: auto;
        "
      >
        @if (generatingProject(); as genProj) {
          ⏱️ {{ getElapsedTime(genProj) }}
        } @else {
          {{ unreadCount() + activeCount() }}
        }
      </span>
    }
  </button>

  <app-recent-activity-modal
    [isOpen]="notificationsFacade.recentActivityOpen()"
    [recentProjects]="recentProjects()"
    [now]="now()"
    (closeModal)="notificationsFacade.closeRecentActivity()"
  >
  </app-recent-activity-modal>
</div>
