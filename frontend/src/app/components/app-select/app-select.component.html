<div
  class="app-select"
  [class.app-select--sm]="size() === 'sm'"
  [class.app-select--disabled]="disabled()"
>
  @if (label()) {
    <label class="app-select__label" [attr.for]="inputId()">{{ label() }}</label>
  }
  <select
    class="app-select__control"
    [attr.id]="inputId()"
    [value]="value()"
    [disabled]="disabled()"
    (change)="onSelect($event)"
  >
    @if (placeholder()) {
      <option value="">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</div>
