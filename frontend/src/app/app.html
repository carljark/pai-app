<main style="max-width: 800px; margin: 40px auto; font-family: system-ui, sans-serif; color: #333; line-height: 1.6; padding: 0 20px;">
  
  <header style="text-align: center; margin-bottom: 40px;">
    <h1 style="color: #2c3e50; font-size: 2.5rem; margin-bottom: 10px;">Plataforma PAI</h1>
    <p style="font-size: 1.2rem; color: #7f8c8d;">Generador de Proyectos Intermodulares con IA</p>
  </header>

  <!-- Panel de Selección -->
  <section style="background: #f8f9fa; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    
    <h2 style="margin-top: 0; color: #2980b9; border-bottom: 2px solid #3498db; padding-bottom: 10px;">
      1. Configuración del Proyecto
    </h2>

    <div style="margin-bottom: 25px;">
      <label style="font-weight: bold; display: block; margin-bottom: 10px;">Metodología Activa:</label>
      <select [ngModel]="methodology()" (ngModelChange)="methodology.set($event)" 
              style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #bdc3c7; font-size: 1rem;">
        <option value="ABP (Aprendizaje Basado en Proyectos)">ABP (Aprendizaje Basado en Proyectos)</option>
        <option value="ABR (Aprendizaje Basado en Retos)">ABR (Aprendizaje Basado en Retos)</option>
        <option value="ApS (Aprendizaje-Servicio)">ApS (Aprendizaje-Servicio)</option>
      </select>
    </div>

    <div style="margin-bottom: 25px;">
      <label style="font-weight: bold; display: block; margin-bottom: 10px;">Resultados de Aprendizaje a Integrar:</label>
      <p style="font-size: 0.9rem; color: #7f8c8d; margin-bottom: 15px;">Selecciona los RAs de distintos módulos que el alumno debe cruzar.</p>
      
      <div style="display: flex; flex-direction: column; gap: 10px;">
        @for (ra of ras(); track ra.id) {
          <label style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: white; border: 1px solid #e0e0e0; border-radius: 6px; cursor: pointer;">
            <input type="checkbox" 
                   [checked]="selectedRas().includes(ra.description)"
                   (change)="toggleRa(ra.description)" 
                   style="margin-top: 5px; cursor: pointer; width: 18px; height: 18px;" />
            <div>
              <strong style="color: #2c3e50;">{{ra.module}} ({{ra.id}}):</strong> 
              <span style="color: #555;">{{ra.description}}</span>
            </div>
          </label>
        }
      </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
      <button (click)="generateProject()" 
              [disabled]="isGenerating() || selectedRas().length === 0"
              style="background-color: #2ecc71; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3); transition: all 0.2s;">
        @if (isGenerating()) {
          🧠 Pensando proyecto...
        } @else {
          ✨ Generar Puente Curricular
        }
      </button>
    </div>

  </section>

  <!-- Resultados de la IA -->
  @if (generatedProject()) {
    <section style="margin-top: 40px; background: white; border: 1px solid #bdc3c7; border-radius: 12px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.08);">
      <h2 style="margin-top: 0; color: #8e44ad; border-bottom: 2px solid #9b59b6; padding-bottom: 10px;">
        Propuesta Intermodular Generada
      </h2>
      
      <!-- Renderizamos el texto markdown de forma sencilla (En producción usaríamos una librería como ngx-markdown) -->
      <div style="white-space: pre-wrap; font-family: Consolas, Monaco, monospace; font-size: 0.95rem; background: #fdfbfd; padding: 20px; border-radius: 8px; border: 1px solid #f3e5f5;">
        {{ generatedProject() }}
      </div>
      
    </section>
  }

</main>
